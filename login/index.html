<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="supported-color-schemes" content="light" />
  <title>Login / Register</title>
  <link
    href="https://fonts.googleapis.com/css?family=Roboto:300,300italic,400,400italic,500,500italic,700,700italic,900,900italic&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Roboto', 'sans-serif'],
          },
        },
      },
    }
  </script>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>

<body class="bg-[#7b7470] font-sans flex items-center justify-center min-h-screen p-4">
  <div class="bg-[#4F4A47] rounded-2xl shadow-lg w-full max-w-md text-white overflow-hidden">
    <!-- Header with logo -->
    <div class="bg-white w-full rounded-t-2xl flex flex-col items-center ">
      <img src="assets/images/ChavaZystemTech_Logo2.png" alt="Logo" class="h-[9rem]"/>
    </div>
    <!-- Tabs -->
    <div class="flex">
      <button id="tab-login" class="w-1/2 py-3 text-center font-semibold border-b-2 transition-colors">
        Login
      </button>
      <button id="tab-register" class="w-1/2 py-3 text-center font-semibold border-b-2 transition-colors">
        Register
      </button>
    </div>

    <!-- Forms Container -->
    <div id="form-container" class="px-6 pb-8 pt-4 min-h-[360px]">
      <!-- Login Form -->
      <form id="form-login" class="space-y-4">
        <div>
          <label for="login-username" class="block text-sm mb-1">User Name</label>
          <div class="relative">
            <input id="login-username" type="text" placeholder="Enter your username"
              class="w-full p-3 pl-10 rounded-md text-[#2F2D2B] bg-[#f5f5f5]" />
            <span class="absolute left-3 top-3 text-[#2F2D2B] material-icons" aria-hidden="true">person</span>
            <span class="absolute right-3 top-3 text-[#bfbfbf] material-icons select-none"
              aria-hidden="true">badge</span>
          </div>
        </div>
        <div>
          <label for="login-password" class="block text-sm mb-1">Password</label>
          <div class="relative">
            <input type="password" autocomplete="current-password" placeholder="Enter your password" id="login-password"
              class="w-full p-3 pl-10 pr-10 rounded-md text-[#2F2D2B] bg-[#f5f5f5]" />
            <span class="absolute left-3 top-3 text-[#2F2D2B] material-icons" aria-hidden="true">lock</span>
            <button type="button" class="absolute right-3 top-2.5 text-[#2F2D2B] material-icons focus:outline-none"
              aria-label="Toggle password visibility" onclick="togglePassword(this, 'login-password')">
              visibility
            </button>
          </div>
        </div>
        <div>
          <label class="block text-sm mb-1"><span class="opacity-0">Placeholder</span></label>
          <div class="relative">
            <button type="button" id="btn-login"
              class="w-full py-3 rounded-md bg-[#f5f5f5] text-[#2F2D2B] hover:bg-white transition flex items-center justify-center gap-2"
              onclick="loginUser()">
              <span id="login-spinner" class="material-icons animate-spin hidden">autorenew</span>
              <span id="login-text">Login</span>
            </button>
          </div>
        </div>
        <button type="button"
          class="w-full mt-2 py-2 rounded-md bg-[#2F2D2B] text-white hover:bg-[#1f1d1b] transition min-h-[48px] flex items-center justify-center gap-2">
          <span class="material-icons" aria-hidden="true">lock_reset</span>
          Forgot Password?
        </button>
      </form>
      <!-- Register Form -->
      <form id="form-register" class="space-y-4 opacity-0 pointer-events-none">
        <!-- Full Name -->
        <div>
          <label for="register-username" class="block text-sm mb-1">User Name</label>
          <div class="relative">
            <input id="register-username" type="text" placeholder="Enter your user name"
              class="w-full p-3 pl-10 rounded-md text-[#2F2D2B] bg-[#f5f5f5]" />
            <span class="absolute left-3 top-3 text-[#2F2D2B] material-icons" aria-hidden="true">person</span>
            <span class="absolute right-3 top-3 text-[#bfbfbf] material-icons select-none"
              aria-hidden="true">badge</span>
          </div>
        </div>
        <!-- Email -->
        <div>
          <label for="register-email" class="block text-sm mb-1">Email</label>
          <div class="relative">
            <input id="register-email" type="email" placeholder="you@example.com"
              class="w-full p-3 pl-10 rounded-md text-[#2F2D2B] bg-[#f5f5f5]" />
            <span class="absolute left-3 top-3 text-[#2F2D2B] material-icons" aria-hidden="true">email</span>
            <span class="absolute right-3 top-3 text-[#bfbfbf] material-icons select-none"
              aria-hidden="true">alternate_email</span>
          </div>
        </div>
        <!-- Password -->
        <div>
          <label for="reg-password" class="block text-sm mb-1">Password</label>
          <div class="relative">
            <input type="password" autocomplete="new-password" placeholder="Enter your password"
              class="w-full p-3 pl-10 pr-10 rounded-md text-[#2F2D2B] bg-[#f5f5f5]" id="reg-password" />
            <span class="absolute left-3 top-3 text-[#2F2D2B] material-icons" aria-hidden="true">lock</span>
            <button type="button" class="absolute right-3 top-2.5 text-[#2F2D2B] material-icons focus:outline-none"
              aria-label="Toggle password visibility" onclick="togglePassword(this, 'reg-password')">
              visibility
            </button>
          </div>
        </div>
        <button type="button" id="btn-register"
          class="w-full mt-2 py-2 rounded-md bg-[#2F2D2B] text-white hover:bg-[#1f1d1b] transition min-h-[48px] flex items-center justify-center gap-2"
          onclick="registerUser()">
          <span id="register-spinner" class="material-icons animate-spin hidden">autorenew</span>
          <span id="register-text">Register</span>
        </button>
      </form>
    </div>
  </div>
  <div class="fixed bottom-4 right-4 text-sm text-white opacity-70">
    Developed By: ChavaZystem Tech ® 2025
  </div>
  
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/script_login.js"></script>
  <div id="toast-container" class="fixed top-5 right-5 z-50"></div>
</body>

</html>
