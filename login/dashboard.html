<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard</title>
  <script>
    const token = localStorage.getItem('auth_token');
    if (!token) {
      window.location.replace('/login/404.html');
    }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class=" min-h-screen flex flex-col items-center justify-center">
  <div class="bg-white w-full rounded-t-2xl flex flex-col items-center pt-6 mb-0">
    <img src="/assets/images/ChavaZystemTech_Logo.png" alt="Logo" class="h-20 mb-2" />
  </div>
  <h1 class="text-2xl font-bold mb-4">Welcome to ChavaZystem Tech</h1>
  <h1 class="text-xs font-bold mb-2">XS size</h1>
  <h1 class="text-sm font-bold mb-2">SM size</h1>
  <h1 class="text-base font-bold mb-2">BASE size</h1>
  <h1 class="text-lg font-bold mb-2">LG size</h1>
  <h1 class="text-xl font-bold mb-2">XL size</h1>
  <h1 class="text-2xl font-bold mb-2">2XL size</h1>
  <h1 class="text-3xl font-bold mb-2">3XL size</h1>
  <h1 class="text-4xl font-bold mb-2">4XL size</h1>
  <button
    onclick="logout()"
    class="px-4 py-2 bg-[#4F4A47] text-white rounded hover:bg-[#3F3A37]">
    Logout
  </button>
  <div class="fixed bottom-4 right-4 text-sm text-black opacity-70">
    Developed By: ChavaZystem Tech ® 2025
  </div>
  <script src="assets/js/script_dashboard.js"></script>
</body>
</html>
